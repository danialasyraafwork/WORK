name: Build Candy Craze PNG images

on:
  push:
    branches:
      - candy-craze-website-preview
    paths:
      - .github/workflows/build-candy-images.yml

permissions:
  contents: write

jobs:
  build-png-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Candy Craze branch
        uses: actions/checkout@v4
        with:
          ref: candy-craze-website-preview

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Build clearer PNG package photos
        shell: bash
        run: |
          set -euo pipefail
          identify assets/packages/basic.webp assets/packages/standard.webp assets/packages/popular.webp assets/packages/premium.webp
          for name in basic standard popular premium; do
            convert "assets/packages/${name}.webp" \
              -filter Lanczos \
              -resize 200% \
              -unsharp 0x0.75+0.75+0.008 \
              -colorspace sRGB \
              -define png:compression-level=9 \
              "assets/packages/${name}.png"
          done
          identify assets/packages/basic.png assets/packages/standard.png assets/packages/popular.png assets/packages/premium.png
          ls -lh assets/packages/basic.png assets/packages/standard.png assets/packages/popular.png assets/packages/premium.png

      - name: Point the site to PNG package images
        shell: bash
        run: |
          perl -pi -e "s/assets\/packages\/basic\.webp/assets\/packages\/basic.png/g; s/assets\/packages\/standard\.webp/assets\/packages\/standard.png/g; s/assets\/packages\/popular\.webp/assets\/packages\/popular.png/g; s/assets\/packages\/premium\.webp/assets\/packages\/premium.png/g" visual-booking.css

      - name: Commit PNG images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/packages/basic.png assets/packages/standard.png assets/packages/popular.png assets/packages/premium.png visual-booking.css
          git commit -m "Use clearer PNG Candy Craze package photos [skip ci]"
          git push origin HEAD:candy-craze-website-preview
