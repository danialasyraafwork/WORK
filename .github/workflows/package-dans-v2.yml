name: Package DANS V2

on:
  push:
    branches:
      - dans-global-empire-v2-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create hosting ZIP
        run: |
          cd DANS-Global-Empire-v2
          zip -r ../DANS-Global-Empire-V2.2-Portfolio.zip .

      - name: Upload hosting ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DANS-Global-Empire-V2.2-Portfolio
          path: DANS-Global-Empire-V2.2-Portfolio.zip
          if-no-files-found: error
          retention-days: 7
