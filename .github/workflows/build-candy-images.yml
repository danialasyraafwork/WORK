name: Build Candy Craze PNG images

on:
  push:
    branches:
      - candy-craze-website-preview
    paths:
      - .github/workflows/build-candy-images.yml

permissions:
  contents: write

jobs:
  build-png-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Candy Craze branch
        uses: actions/checkout@v4
        with:
          ref: candy-craze-website-preview

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Build four PNGs from the real package source
        shell: bash
        run: |
          set -euo pipefail
          identify assets/packages/candy-craze-packages.webp
          W=$(identify -format '%w' assets/packages/candy-craze-packages.webp)
          H=$(identify -format '%h' assets/packages/candy-craze-packages.webp)
          Q=$((W / 4))
          convert assets/packages/candy-craze-packages.webp -crop ${Q}x${H}+0+0 +repage assets/packages/basic.png
          convert assets/packages/candy-craze-packages.webp -crop ${Q}x${H}+${Q}+0 +repage assets/packages/standard.png
          convert assets/packages/candy-craze-packages.webp -crop ${Q}x${H}+$((Q * 2))+0 +repage assets/packages/popular.png
          convert assets/packages/candy-craze-packages.webp -crop ${Q}x${H}+$((Q * 3))+0 +repage assets/packages/premium.png
          identify assets/packages/basic.png assets/packages/standard.png assets/packages/popular.png assets/packages/premium.png
          ls -lh assets/packages/basic.png assets/packages/standard.png assets/packages/popular.png assets/packages/premium.png

      - name: Point the site to PNG package images
        shell: bash
        run: |
          perl -pi -e "s/assets\/packages\/basic\.webp/assets\/packages\/basic.png/g; s/assets\/packages\/standard\.webp/assets\/packages\/standard.png/g; s/assets\/packages\/popular\.webp/assets\/packages\/popular.png/g; s/assets\/packages\/premium\.webp/assets\/packages\/premium.png/g" visual-booking.css

      - name: Commit PNG images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/packages/basic.png assets/packages/standard.png assets/packages/popular.png assets/packages/premium.png visual-booking.css
          git commit -m "Use PNG Candy Craze package photos [skip ci]"
          git push origin HEAD:candy-craze-website-preview
