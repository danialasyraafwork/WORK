name: Deploy Candy Craze to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-candy-craze-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: candy-craze-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest Candy Craze site
        uses: actions/checkout@v4
        with:
          ref: candy-craze-website-preview

      - name: Checkout DANS Global Empire site
        uses: actions/checkout@v4
        with:
          ref: dans-global-empire-website
          path: _dans_source

      - name: Add DANS Global Empire preview
        shell: bash
        run: |
          rm -rf DANS-Global-Empire
          cp -a _dans_source/DANS-Global-Empire ./DANS-Global-Empire
          rm -rf _dans_source

      - name: Checkout DANS Global Empire v2 preview
        uses: actions/checkout@v4
        with:
          ref: dans-global-empire-v2-preview
          path: _dans_v2_source

      - name: Add DANS Global Empire v2 preview
        shell: bash
        run: |
          rm -rf DANS-Global-Empire-v2
          cp -a _dans_v2_source/DANS-Global-Empire-v2 ./DANS-Global-Empire-v2
          rm -rf _dans_v2_source

      - name: Build hosting ZIP
        shell: bash
        run: |
          zip -r Candy-Craze-Hosting.zip \
            index.html \
            script.js \
            styles.css \
            visual-booking.css \
            robots.txt \
            sitemap.xml \
            favicon.ico \
            favicon.png \
            assets

      - name: Upload hosting ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Candy-Craze-Hosting
          path: Candy-Craze-Hosting.zip
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Candy Craze site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

