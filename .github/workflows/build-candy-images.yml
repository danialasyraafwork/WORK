name: Finalize Candy Craze direct package images

on:
  push:
    branches:
      - candy-craze-website-preview
    paths:
      - .github/workflows/build-candy-images.yml

permissions:
  contents: write

jobs:
  finalize-direct-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Candy Craze branch
        uses: actions/checkout@v4
        with:
          ref: candy-craze-website-preview

      - name: Remove old image loader and bust image CSS cache
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's#\n  <script src="package-image-loader\.js\?v=1" defer></script>##g' index.html
          perl -pi -e 's/visual-booking\.css\?v=2/visual-booking.css?v=3/g' index.html
          grep -q 'visual-booking.css?v=3' index.html
          if grep -q 'package-image-loader.js' index.html; then
            echo 'Old package image loader is still present' >&2
            exit 1
          fi
          grep -q "assets/packages/basic.png" visual-booking.css
          grep -q "assets/packages/standard.png" visual-booking.css
          grep -q "assets/packages/popular.png" visual-booking.css
          grep -q "assets/packages/premium.png" visual-booking.css

      - name: Commit direct image setup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html visual-booking.css
          git diff --cached --quiet && exit 0
          git commit -m "Use direct Candy Craze package images [skip ci]"
          git push origin HEAD:candy-craze-website-preview
