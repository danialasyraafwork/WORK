name: Build Candy Craze PNG images

on:
  push:
    branches:
      - candy-craze-website-preview
    paths:
      - .github/workflows/build-candy-images.yml

permissions:
  contents: write

jobs:
  build-png-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Candy Craze branch
        uses: actions/checkout@v4
        with:
          ref: candy-craze-website-preview

      - name: Build four PNGs from the real package source
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries stream=width,height -of default=noprint_wrappers=1 assets/packages/candy-craze-packages.webp
          ffmpeg -y -i assets/packages/candy-craze-packages.webp -vf "crop=iw/4:ih:0:0" -frames:v 1 assets/packages/basic.png
          ffmpeg -y -i assets/packages/candy-craze-packages.webp -vf "crop=iw/4:ih:iw/4:0" -frames:v 1 assets/packages/standard.png
          ffmpeg -y -i assets/packages/candy-craze-packages.webp -vf "crop=iw/4:ih:iw/2:0" -frames:v 1 assets/packages/popular.png
          ffmpeg -y -i assets/packages/candy-craze-packages.webp -vf "crop=iw/4:ih:iw*3/4:0" -frames:v 1 assets/packages/premium.png
          file assets/packages/basic.png assets/packages/standard.png assets/packages/popular.png assets/packages/premium.png
          ls -lh assets/packages/basic.png assets/packages/standard.png assets/packages/popular.png assets/packages/premium.png

      - name: Point the site to PNG package images
        shell: bash
        run: |
          perl -pi -e "s/assets\/packages\/basic\.webp/assets\/packages\/basic.png/g; s/assets\/packages\/standard\.webp/assets\/packages\/standard.png/g; s/assets\/packages\/popular\.webp/assets\/packages\/popular.png/g; s/assets\/packages\/premium\.webp/assets\/packages\/premium.png/g" visual-booking.css

      - name: Commit PNG images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/packages/basic.png assets/packages/standard.png assets/packages/popular.png assets/packages/premium.png visual-booking.css
          git commit -m "Use PNG Candy Craze package photos [skip ci]"
          git push origin HEAD:candy-craze-website-preview
